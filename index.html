<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>SNI SNA SNACKKKK!!!!!!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffee, #ffcc00);
      background-size: 800% 800%;
      animation: gradientMove 15s ease infinite;
      color: white;
      text-align: center;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* GROTERE MAIN BOX */
    .container {
      background: rgba(0,0,0,0.45);
      padding: 70px 90px;
      border-radius: 30px;
      backdrop-filter: blur(15px);
      box-shadow: 
        0 0 40px rgba(0,0,0,0.6),
        0 0 80px rgba(255,255,255,0.2);
      animation: float 4s ease-in-out infinite;
      transform: scale(1.15);
    }

    @keyframes float {
      0%,100% { transform: translateY(0px) scale(1.15); }
      50% { transform: translateY(-15px) scale(1.15); }
    }

    /* GROTERE TITEL */
    h1 {
      font-size: 4.5rem;
      margin-bottom: 35px;
      font-weight: 900;
      text-shadow: 
        0 0 10px #fff,
        0 0 20px #ff00cc,
        0 0 40px #3333ff;
    }

    .countdown {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    /* GROTERE TIJD BOXEN */
    .time-box {
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 20px;
      min-width: 130px;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
    }

    .number {
      font-size: 3.5rem;
      font-weight: 600;
    }

    .label {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .emoji {
      font-size: 3rem;
      margin-top: 25px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      font-size: 1rem;
      opacity: 0.8;
    }

    /* mobiel optimalisatie */
    @media (max-width: 600px) {
      .container {
        padding: 40px;
        transform: scale(1);
      }

      h1 {
        font-size: 2.5rem;
      }

      .time-box {
        min-width: 90px;
        padding: 20px;
      }

      .number {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>SNI SNA SNACKKKK!!!!!!</h1>

  <div class="countdown">
    <div class="time-box">
      <div class="number" id="days">0</div>
      <div class="label">Dagen</div>
    </div>
    <div class="time-box">
      <div class="number" id="hours">0</div>
      <div class="label">Uren</div>
    </div>
    <div class="time-box">
      <div class="number" id="minutes">0</div>
      <div class="label">Minuten</div>
    </div>
    <div class="time-box">
      <div class="number" id="seconds">0</div>
      <div class="label">Seconden</div>
    </div>
  </div>

  <div class="emoji">🍟🍕🍔🍿</div>
</div>

<footer>
Snack countdown powered by pure snack energy ⚡
</footer>

<script>
function getNextFriday1230Amsterdam() {
  const now = new Date();
  const formatter = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Europe/Amsterdam',
    year: 'numeric',
    month: 'numeric',
    day: 'numeric',
    hour: 'numeric',
    minute: 'numeric',
    second: 'numeric',
    hour12: false
  });

  const parts = formatter.formatToParts(now);
  const map = {};
  parts.forEach(p => map[p.type] = p.value);

  let amsterdamNow = new Date(
    map.year,
    map.month - 1,
    map.day,
    map.hour,
    map.minute,
    map.second
  );

  let day = amsterdamNow.getDay();
  let daysUntilFriday = (5 - day + 7) % 7;

  let target = new Date(amsterdamNow);
  target.setDate(amsterdamNow.getDate() + daysUntilFriday);
  target.setHours(12, 30, 0, 0);

  if (daysUntilFriday === 0 && amsterdamNow > target) {
    target.setDate(target.getDate() + 7);
  }

  return target;
}

const targetDate = getNextFriday1230Amsterdam();

function updateCountdown() {
  const now = new Date();
  const diff = targetDate - now;

  if (diff <= 0) {
    document.querySelector(".container").innerHTML =
      "<h1>🍟 HET IS SNACK TIJD!!!! 🍟</h1>";
    return;
  }

  document.getElementById("days").textContent =
    Math.floor(diff / (1000*60*60*24));

  document.getElementById("hours").textContent =
    Math.floor(diff / (1000*60*60) % 24);

  document.getElementById("minutes").textContent =
    Math.floor(diff / (1000*60) % 60);

  document.getElementById("seconds").textContent =
    Math.floor(diff / 1000 % 60);
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
