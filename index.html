<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>SNI SNA SNACKKKK!!!!!!</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(270deg, #ff00cc, #3333ff, #00ffee, #ffcc00);
      background-size: 800% 800%;
      animation: gradientMove 15s ease infinite;
      color: white;
      text-align: center;
      overflow: hidden;
      transition: all 0.4s ease;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      background: rgba(0,0,0,0.45);
      padding: 70px 90px;
      border-radius: 30px;
      backdrop-filter: blur(15px);
      box-shadow: 0 0 40px rgba(0,0,0,0.6),
                  0 0 80px rgba(255,255,255,0.2);
      animation: float 4s ease-in-out infinite;
      transform: scale(1.15);
      transition: all 0.4s ease;
    }

    @keyframes float {
      0%,100% { transform: translateY(0px) scale(1.15); }
      50% { transform: translateY(-15px) scale(1.15); }
    }

    h1 {
      font-size: 4.5rem;
      margin-bottom: 35px;
      font-weight: 900;
      text-shadow: 0 0 10px #fff,
                   0 0 20px #ff00cc,
                   0 0 40px #3333ff;
      transition: all 0.4s ease;
    }

    .countdown {
      display: flex;
      gap: 30px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .time-box {
      background: rgba(255,255,255,0.15);
      padding: 30px;
      border-radius: 20px;
      min-width: 130px;
      box-shadow: 0 0 20px rgba(255,255,255,0.4);
      transition: all 0.4s ease;
    }

    .number {
      font-size: 3.5rem;
      font-weight: 600;
    }

    .label {
      font-size: 1.2rem;
      opacity: 0.9;
    }

    .emoji {
      font-size: 3rem;
      margin-top: 25px;
      animation: bounce 1s infinite alternate;
    }

    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }

    footer {
      position: absolute;
      bottom: 15px;
      width: 100%;
      font-size: 1rem;
      opacity: 0.8;
    }

    body.nuc-mode {
      background: #111;
      animation: none;
    }

    body.nuc-mode .container {
      backdrop-filter: none;
      box-shadow: none;
      animation: none;
      transform: none;
    }

    body.nuc-mode h1 {
      text-shadow: none;
    }

    body.nuc-mode .time-box {
      box-shadow: none;
      background: #222;
    }

    body.nuc-mode .emoji {
      animation: none;
    }

    .nuc-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      background: rgba(0,0,0,0.6);
      padding: 10px 15px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      user-select: none;
      transition: 0.3s;
    }

    .nuc-toggle:hover {
      background: rgba(0,0,0,0.8);
    }

    body.nuc-mode .nuc-toggle {
      background: #444;
    }

    @media (max-width: 600px) {
      .container {
        padding: 40px;
        transform: scale(1);
      }

      h1 {
        font-size: 2.5rem;
      }

      .time-box {
        min-width: 90px;
        padding: 20px;
      }

      .number {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<div class="nuc-toggle" onclick="toggleNucMode()">
  🧊 NUC MODUS
</div>

<div class="container">
  <h1>SNI SNA SNACKKKK!!!!!!</h1>

  <div class="countdown">
    <div class="time-box">
      <div class="number" id="days">0</div>
      <div class="label">Dagen</div>
    </div>
    <div class="time-box">
      <div class="number" id="hours">0</div>
      <div class="label">Uren</div>
    </div>
    <div class="time-box">
      <div class="number" id="minutes">0</div>
      <div class="label">Minuten</div>
    </div>
    <div class="time-box">
      <div class="number" id="seconds">0</div>
      <div class="label">Seconden</div>
    </div>
  </div>

  <div class="emoji" id="emoji">🍟🍕🍔🍿</div>
</div>

<footer>
Snack countdown powered by pure snack energy ⚡
</footer>

<audio id="snackSound" src="Snack.wav"></audio>
<audio id="radSound" src="rad.mp3"></audio>

<script>
function toggleNucMode() {
  document.body.classList.toggle("nuc-mode");
}

function getNextFridayTimes() {
  const now = new Date();
  let day = now.getDay();
  let daysUntilFriday = (5 - day + 7) % 7;

  let base = new Date(now);
  base.setDate(now.getDate() + daysUntilFriday);

  let snackTime = new Date(base);
  snackTime.setHours(12, 30, 0, 0);

  let beerTime = new Date(base);
  beerTime.setHours(16, 0, 0, 0);

  let radTime = new Date(base);
  radTime.setHours(15, 45, 0, 0);

  if (daysUntilFriday === 0 && now > beerTime) {
    snackTime.setDate(snackTime.getDate() + 7);
    beerTime.setDate(beerTime.getDate() + 7);
    radTime.setDate(radTime.getDate() + 7);
  }

  return { snackTime, beerTime, radTime };
}

let times = getNextFridayTimes();
let radPlayed = false;

async function getWeatherMessage() {
  try {
    const res = await fetch(
      "https://api.open-meteo.com/v1/forecast?latitude=52&longitude=4.23&current_weather=true&timezone=Europe%2FAmsterdam"
    );

    const data = await res.json();
    const temp = Math.round(data.current_weather.temperature);

    if (temp >= 22) {
      return `Het is ${temp}°C. Mooi weer voor een lekker pintemannetje op het dakterras 🍺☀️`;
    } else {
      return `Tijd voor een lekker pintemannetje in de loods 🍺🏭`;
    }

  } catch (e) {
    return "Tijd voor een lekker pintemannetje 🍺";
  }
}

function updateCountdown() {
  const now = new Date();

  let target;
  let title = document.querySelector("h1");
  let emoji = document.getElementById("emoji");

  if (now < times.snackTime) {
    target = times.snackTime;
    title.textContent = "SNI SNA SNACKKKK!!!!!!";
    emoji.textContent = "🍟🍕🍔🍿";
  } 
  else if (now >= times.snackTime && now < times.beerTime) {
    target = times.beerTime;
    title.textContent = "🍺 4 UUR BIER UUR 🍺";

    if (now >= times.radTime) {
      emoji.textContent = "🎡🍺🔥🍻";
    } else {
      emoji.textContent = "🍺🍻🍺🍻";
    }
  } 
  else {
    const diff = target - now;

    if (diff <= 0) {
      if (target === times.snackTime) {
        document.querySelector(".container").innerHTML =
          "<h1>🍟 HET IS SNACK TIJD!!!! 🍟</h1><div class='emoji'>🍟🍔🔥🍕</div>";
        document.getElementById("snackSound").play();
      } else {
        getWeatherMessage().then(msg => {
          document.querySelector(".container").innerHTML =
            `<h1>🍺 BIER TIJD!!!! 🍺</h1>
             <p style="font-size:1.5rem; margin-top:20px;">${msg}</p>
             <div class='emoji'>🍺🍻🔥🍺</div>`;
        });
      }
      return;
    }

    times = getNextFridayTimes();
    radPlayed = false;
    return;
  }

  if (!radPlayed && now >= times.radTime && now < times.beerTime) {
    document.getElementById("radSound").play();
    radPlayed = true;
  }

  const diff = target - now;

  if (diff <= 0) {
    if (target === times.snackTime) {
      document.querySelector(".container").innerHTML =
        "<h1>🍟 HET IS SNACK TIJD!!!! 🍟</h1><div class='emoji'>🍟🍔🔥🍕</div>";
      document.getElementById("snackSound").play();
    } else {
      getWeatherMessage().then(msg => {
        document.querySelector(".container").innerHTML =
          `<h1>🍺 BIER TIJD!!!! 🍺</h1>
           <p style="font-size:1.5rem; margin-top:20px;">${msg}</p>
           <div class='emoji'>🍺🍻🔥🍺</div>`;
      });
    }
    return;
  }

  document.getElementById("days").textContent =
    Math.floor(diff / (1000*60*60*24));

  document.getElementById("hours").textContent =
    Math.floor(diff / (1000*60*60) % 24);

  document.getElementById("minutes").textContent =
    Math.floor(diff / (1000*60) % 60);

  document.getElementById("seconds").textContent =
    Math.floor(diff / 1000 % 60);
}

setInterval(updateCountdown, 1000);
updateCountdown();
</script>

</body>
</html>
